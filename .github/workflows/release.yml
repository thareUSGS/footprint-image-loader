name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Package plugin
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/lift"
          mkdir -p "$package_dir"
          git archive "$GITHUB_SHA" | tar -xf - --exclude=.gitignore -C "$package_dir"
          cd "$RUNNER_TEMP"
          zip -r "$GITHUB_WORKSPACE/lift-${GITHUB_REF_NAME}.zip" lift

      - name: Create release or upload package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "lift-${GITHUB_REF_NAME}.zip" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "lift-${GITHUB_REF_NAME}.zip" \
              --title "LIFT - Load Image From Footprint $GITHUB_REF_NAME" \
              --generate-notes
          fi
