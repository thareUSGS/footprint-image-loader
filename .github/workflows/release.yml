name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Package plugin
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/footprint_image_loader"
          mkdir -p "$package_dir"
          git archive "$GITHUB_SHA" | tar -xf - --exclude=.gitignore -C "$package_dir"
          cd "$RUNNER_TEMP"
          zip -r "$GITHUB_WORKSPACE/footprint_image_loader-${GITHUB_REF_NAME}.zip" footprint_image_loader

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "footprint_image_loader-${GITHUB_REF_NAME}.zip" \
            --title "Footprint Image Loader $GITHUB_REF_NAME" \
            --generate-notes
